name: Trigger Enterprise Repo Update Workflow
on:
  workflow_dispatch:
#  push:
#    branches: [ main ]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Generate authentication token
        id: gen-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.CVAT_WF_BOT_APP_ID }}
          private-key: ${{ secrets.CVAT_WF_BOT_PRIVATE_KEY }}
          repositories: "private"

      - name: Trigger private repository workflow
        env:
          GH_TOKEN: "${{ steps.gen-token.outputs.token }}"
          GH_REPO: "azhavoro-org/private"
        run: |
          gh api \
            --method POST \
            /repos/${GH_REPO}/dispatches \
            -f 'event_type=update of CVAT submodule' \
            -F "client_payload[triggeredBy]=${{ github.repository }}" \
            -F "client_payload[commitSha]=${{ github.sha }}" \
            -F "client_payload[branch]=${{ github.ref }}"
       
